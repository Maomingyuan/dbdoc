server:
  port: 8080

spring:
  application:
    name: dbdoc-server
  datasource:
    url: ${DBDOC_DB_URL:jdbc:mysql://localhost:3306/dbdoc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DBDOC_DB_USERNAME:root}
    password: ${DBDOC_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: info
    com.dbdoc: debug